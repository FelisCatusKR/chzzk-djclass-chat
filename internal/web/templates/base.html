{{define "base"}}<!DOCTYPE html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- htmx swaps 2xx only by default; also swap 429 so rate-limit messages
         (sent with the card body) are shown. -->
    <meta name="htmx-config"
          content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"429","swap":true,"error":false},{"code":"[45]..","swap":false,"error":true}]}' />
    <title>{{block "title" .}}DJ CLASS Overlay{{end}}</title>
    <!-- daisyUI components + all themes, Tailwind utilities at runtime (no build, no Node).
         Versions pinned with SRI; bump = new hash (see AGENTS.md). -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.47/daisyui.min.css"
          integrity="sha384-HJlwiuPeyqbr52ODXrIkU2nBvJUuUMocBCAL6hEMbdJwYmZAO4g2LjvkGOO+veDz"
          crossorigin="anonymous"
          rel="stylesheet"
          type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.47/themes.css"
          integrity="sha384-ABgYFxznUCmZfZBDGGfyjJ9qjpOUS3Adc0mywmoxDxPNlt2ljZNg6JN41d79ypz2"
          crossorigin="anonymous"
          rel="stylesheet"
          type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.min.js"
            integrity="sha384-aJ9rL4k6lF+91guGvUFVSkpIcge7Zd9EiI4TQDLoK9kFaFJgKHgjEXVvG/qA5COj"
            crossorigin="anonymous"></script>
    <style type="text/tailwindcss">
      @layer components {
        .frosted-card {
          @apply rounded-2xl border border-white/90 bg-white/70 shadow-lg backdrop-blur-md;
        }

        .btn-chzzk {
          @apply block rounded-lg bg-gray-900 py-3 text-sm font-bold text-yellow-400;
        }

        .btn-chzzk-alt {
          @apply block rounded-lg bg-yellow-500 py-3 text-sm font-bold text-gray-900;
        }
      }
    </style>
    <script defer
            src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"
            integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
            crossorigin="anonymous"></script>
    <script defer src="/static/js/components.js"></script>
    <script defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"
            integrity="sha384-l8f0VcPi/M1iHPv8egOnY/15TDwqgbOR1anMIJWvU6nLRgZVLTLSaNqi/TOoT5Fh"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/static/css/chat.css" />
    <style>
      /* Pretendard (Korean font), matching the legacy app — jsDelivr, version-pinned. */
      @font-face {
        font-family: "Pretendard";
        src: url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");
        font-weight: 45 920;
        font-display: swap;
      }

      body {
        font-family: "Pretendard", system-ui, "Apple SD Gothic Neo", "Noto Sans KR",
          "Malgun Gothic", sans-serif;
      }
    </style>
  </head>
  <!-- No CSRF token: state-changing requests are protected by
       http.CrossOriginProtection (Sec-Fetch-Site / Origin) + SameSite=Lax.
       No hx-boost: page navigations are plain full loads, so Alpine initialises
       each page exactly once (boost + Alpine's observer + components.js's
       initTree double-initialised the dashboard preview). htmx is only used for
       in-page fragment swaps (the /link card). -->
  <body class="min-h-screen">
    <!-- SiteBackground: fixed blurred cover-image + white wash -->
    <div aria-hidden="true"
         class="fixed inset-0 -z-10 bg-cover bg-center"
         style="background-image:url('https://chzzk-djclass-assets.pages.dev/cover.jpg');
                filter:blur(2px) brightness(1.15);
                transform:scale(1.05)"></div>
    <div aria-hidden="true"
         class="fixed inset-0 -z-10"
         style="background:rgba(248,248,250,0.82)"></div>
    <main id="content">
      {{block "content" .}}{{end}}
    </main>
  </body>
</html>{{end}}
