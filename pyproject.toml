[project]
name = "chzzk-djclass-chat"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=49.0.0",
    "django==6.0.6",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
