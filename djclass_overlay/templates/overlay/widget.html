{% load static %}

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DJ CLASS Overlay</title>
    <link rel="stylesheet" href="{% static 'css/chat.css' %}" />
    <style>
      /* Layout-only rules. Badge/row/glint + text styles → chat.css */
      @font-face {
        font-family: "Pretendard";
        src: url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");
        font-weight: 45 920;
        font-display: swap;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      #chat {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        height: 100vh;
        padding: 8px;
        gap: 4px;
        box-sizing: border-box;
        font-family: "Pretendard", system-ui, "Apple SD Gothic Neo", sans-serif;
        color: #fff;
      }

      .emoji {
        height: 1em;
        vertical-align: text-bottom;
      }

      #status {
        position: fixed;
        top: 4px;
        left: 4px;
        font-size: 12px;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div id="status">채팅 연결 중…</div>
    <div id="chat"
         class="ts-shadow dim-unverified"
         data-channel-id="{{ channel_id }}"></div>
    <script src="{% static 'overlay/widget.js' %}"></script>
  </body>
</html>
