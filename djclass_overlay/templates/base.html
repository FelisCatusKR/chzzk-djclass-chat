{% load static %}
<!doctype html>
<html lang="ko" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}DJ CLASS Overlay{% endblock %}</title>
    <!-- daisyUI components + all themes, Tailwind utilities at runtime (no build, no Node). -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="{% static 'css/badge.css' %}" />
  </head>
  <body class="min-h-screen bg-base-200">
    {% block content %}{% endblock %}
    <!-- Alpine loads LAST (after any page x-data component scripts) so that
         deferred component definitions (e.g. widget-preview.js) are registered
         before Alpine initializes. -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  </body>
</html>
