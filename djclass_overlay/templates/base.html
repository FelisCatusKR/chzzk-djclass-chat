{% load static %}
<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}DJ CLASS Overlay{% endblock %}</title>
    <!-- daisyUI components + all themes, Tailwind utilities at runtime (no build, no Node). -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @layer components {
        .frosted-card { @apply rounded-2xl border border-white/90 bg-white/70 shadow-lg backdrop-blur-md; }
        .btn-chzzk { @apply block rounded-lg bg-gray-900 py-3 text-sm font-bold text-yellow-400; }
        .btn-chzzk-alt { @apply block rounded-lg bg-yellow-500 py-3 text-sm font-bold text-gray-900; }
      }
    </style>
    <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <script defer src="{% static 'js/components.js' %}"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="{% static 'css/badge.css' %}" />
    <style>
      /* Pretendard (Korean font), matching the legacy app — jsDelivr, version-pinned. */
      @font-face {
        font-family: "Pretendard";
        src: url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2")
          format("woff2-variations");
        font-weight: 45 920;
        font-display: swap;
      }
      body {
        font-family: "Pretendard", system-ui, "Apple SD Gothic Neo", "Noto Sans KR",
          "Malgun Gothic", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen" hx-boost="true" hx-target="#content" hx-select="#content" hx-swap="outerHTML">
    <!-- SiteBackground: fixed blurred cover-image + white wash (ported from SiteBackground.tsx) -->
    <div aria-hidden="true" class="fixed inset-0 -z-10 bg-cover bg-center"
         style="background-image:url('https://chzzk-djclass-assets.pages.dev/cover.jpg');filter:blur(2px) brightness(1.15);transform:scale(1.05)"></div>
    <div aria-hidden="true" class="fixed inset-0 -z-10"
         style="background:rgba(248,248,250,0.82)"></div>
    <main id="content" hx-history-elt>{% block content %}{% endblock %}</main>
  </body>
</html>
