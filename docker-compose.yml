services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: djclass_overlay
      POSTGRES_USER: djclass
      POSTGRES_PASSWORD: devpassword
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U djclass -d djclass_overlay']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
