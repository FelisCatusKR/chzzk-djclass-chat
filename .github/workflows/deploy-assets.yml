name: Deploy Assets

# Static assets in public/ are served from Cloudflare Pages as a CDN edge copy.
# Only runs when those assets change — the app itself deploys via ci.yml (Dokku).
on:
  push:
    branches: [main]
    paths: ['public/**']

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./public --project-name=chzzk-djclass-assets --branch=main
