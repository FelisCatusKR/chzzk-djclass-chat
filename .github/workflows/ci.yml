name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: djclass_overlay
          POSTGRES_USER: djclass
          POSTGRES_PASSWORD: devpassword
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U djclass -d djclass_overlay"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-secret-0123456789abcdef0123456789abcdef0123456789
      VARCHIVE_TOKEN_KEY: ci-dummy-key-32-characters-long!!
      CHZZK_CLIENT_ID: ci-dummy
      CHZZK_CLIENT_SECRET: ci-dummy
      DATABASE_URL: postgres://djclass:devpassword@localhost:5432/djclass_overlay
      BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -q
      - run: uv run python manage.py collectstatic --noinput
      - name: Deploy-security check (production settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: example.com
          BASE_URL: https://example.com
        run: uv run python manage.py check --deploy --fail-level WARNING

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Never let two pushes race the same Dokku build.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DOKKU_HOST: ${{ secrets.DOKKU_SSH_HOST }}
      # cloudflared reads these for non-interactive Access service-token auth.
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Install cloudflared
        run: |
          sudo curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
      - name: Configure deploy SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Trigger Dokku deploy through Cloudflare Tunnel
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o ProxyCommand="cloudflared access ssh --hostname %h" \
              dokku@"$DOKKU_HOST" -- \
              git:sync --build chatoverlay \
              https://github.com/FelisCatusKR/chzzk-djclass-chat.git main
