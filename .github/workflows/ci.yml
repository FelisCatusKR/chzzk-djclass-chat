name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded PR runs are cancelled. Runs on main are not: each passing commit is
# published (see `publish`), and cancelling one halfway would leave untagged
# digests behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every check except the image build: Go (gofmt, sqlc, vet, race tests) and
  # the two embedded browser scripts (eslint, executed smoke test). Tools come
  # from mise.toml.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # mise.toml, go.mod and the Dockerfile builder must pin the same Go.
      - run: test "$(mise current go)" = "$(go mod edit -json | jq -r .Go)"
      - run: grep -q "^FROM golang:$(mise current go)-" Dockerfile
      - run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      # Generated sqlc code must match queries.sql + migrations.
      - run: sqlc diff
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # widget.js / components.js have no other coverage; `node --check` is
      # syntax-only, so the smoke test executes them (catches load-time crashes).
      - run: npm ci
      - run: npm run lint
      - run: node tests/widget-smoke.cjs

  # The production image must keep building (static binary, distroless).
  go-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target go-runner -t djclass-go:ci .
      - run: docker run --rm djclass-go:ci healthcheck || test $? -eq 1 # binary runs (no server → exit 1)

  # ---------------------------------------------------------------------------
  # Publish the production image to GHCR (main only, after every check passed).
  # The host pulls ghcr.io/feliscatuskr/chzzk-djclass-chat:main and redeploys
  # when its org.opencontainers.image.revision label changes (homelab-infra
  # reconcile, image_source: ghcr). Same layout as FelisCatusKR/organon:
  # native amd64/arm64 builds pushed by digest, then one multi-arch manifest
  # tagged `main` and `sha-<7>` (rollback = pin that tag in homelab-infra).
  # ---------------------------------------------------------------------------
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Docs-only commits are not published, so they don't restart production.
      - id: diff
        env:
          BASE: ${{ github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "image=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if grep -qvE '\.md$|^docs/|^LICENSE$' <<<"$changed"; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: publish (${{ matrix.arch }})
    needs: [build, go-image, changes]
    if: needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/feliscatuskr/chzzk-djclass-chat
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: go-runner
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: publish (manifest)
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/feliscatuskr/chzzk-djclass-chat
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:main"
