name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded PR runs are cancelled. Runs on main are not: each passing commit is
# published (see `publish`), and cancelling one halfway would leave untagged
# digests behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: djclass_overlay
          POSTGRES_USER: djclass
          POSTGRES_PASSWORD: devpassword
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U djclass -d djclass_overlay"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-secret-0123456789abcdef0123456789abcdef0123456789
      VARCHIVE_TOKEN_KEY: ci-dummy-key-32-characters-long!!
      CHZZK_CLIENT_ID: ci-dummy
      CHZZK_CLIENT_SECRET: ci-dummy
      DATABASE_URL: postgres://djclass:devpassword@localhost:5432/djclass_overlay
      BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      # Frontend gates: lint + EXECUTE the no-build browser scripts. widget.js /
      # components.js have no other coverage and `node --check` is syntax-only, so a
      # load-time crash (e.g. the PR#17 FONT_MAP init-order bug) only surfaces here.
      - uses: jdx/mise-action@v2
        with:
          install_args: node
      - run: npm ci
      - run: npm run lint
      - run: node tests/widget-smoke.cjs
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      # Static lint/format gates (no DB or Django setup needed) — fail fast.
      - run: uv run ruff check djclass_overlay config manage.py
      - run: uv run ruff format --check djclass_overlay config manage.py
      - run: uv run djlint djclass_overlay/templates --check
      - run: uv run djlint djclass_overlay/templates --lint
      - run: uv run mypy djclass_overlay config
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -q
      - run: uv run python manage.py collectstatic --noinput
      - name: Deploy-security check (production settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: example.com
          BASE_URL: https://example.com
        run: uv run python manage.py check --deploy --fail-level WARNING

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: go sqlc
      # mise.toml and go.mod must pin the same Go version (GOTOOLCHAIN would
      # otherwise silently fetch a different one).
      - run: test "$(mise current go)" = "$(go mod edit -json | jq -r .Go)"
      # ...and the Dockerfile's builder image too.
      - run: grep -q "^FROM golang:$(mise current go)-" ../Dockerfile
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # Generated sqlc code must match queries.sql + migrations.
      - run: sqlc diff
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  # The Go image (cutover target) must keep building: embedded assets copied
  # from the Django tree, static binary, distroless runtime.
  go-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target go-runner -t djclass-go:ci .
      - run: docker run --rm djclass-go:ci healthcheck || test $? -eq 1 # binary runs (no server → exit 1)

  # ---------------------------------------------------------------------------
  # Publish the production image to GHCR (main only, after every check passed).
  # The host pulls ghcr.io/feliscatuskr/chzzk-djclass-chat:main and redeploys
  # when its org.opencontainers.image.revision label changes (homelab-infra
  # reconcile, image_source: ghcr). Same layout as FelisCatusKR/organon:
  # native amd64/arm64 builds pushed by digest, then one multi-arch manifest
  # tagged `main` and `sha-<7>` (rollback = pin that tag in homelab-infra).
  # ---------------------------------------------------------------------------
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Docs-only commits are not published, so they don't restart production.
      - id: diff
        env:
          BASE: ${{ github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "image=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if grep -qvE '\.md$|^docs/|^LICENSE$' <<<"$changed"; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: publish (${{ matrix.arch }})
    needs: [build, go, go-image, changes]
    if: needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/feliscatuskr/chzzk-djclass-chat
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: go-runner
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: publish (manifest)
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/feliscatuskr/chzzk-djclass-chat
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:main"
